name: Validate

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    push:
        branches: ['V4-china']
    workflow_dispatch:
    workflow_call:

concurrency:
    # Reusable release validation must not cancel the standalone push validation.
    group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --include=optional --ignore-scripts

            - name: Check locked Linux native dependencies
              run: node scripts/tests/platform-smoke.mjs --lock-only

            - name: Build
              run: npm run build

            - name: Test
              run: |
                  npm test
                  npm run test:performance
                  npm run test:preview

            - name: Test container shell startup and lock fixtures without real tasks
              run: |
                  bash -n scripts/docker/*.sh scripts/tests/docker*.sh
                  bash scripts/tests/docker-fixtures.sh

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

    container-smoke:
        name: Container (${{ matrix.arch }}, ${{ matrix.dockerfile }})
        needs: validate
        # Native GitHub runners exercise both architectures without QEMU.
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                      dockerfile: Dockerfile
                      cache: default
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      dockerfile: Dockerfile
                      cache: default
                    - arch: amd64
                      runner: ubuntu-24.04
                      dockerfile: Dockerfile.cn
                      cache: cn
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      dockerfile: Dockerfile.cn
                      cache: cn
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build target runtime image without publishing
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/${{ matrix.arch }}
                  load: true
                  push: false
                  tags: mrs-platform-smoke:local
                  cache-from: type=gha,scope=smoke-${{ matrix.cache }}-${{ matrix.arch }}
                  cache-to: type=gha,scope=smoke-${{ matrix.cache }}-${{ matrix.arch }},mode=max

            - name: Verify native client and headless Chromium with loopback only
              env:
                  TARGET_ARCH: ${{ matrix.arch }}
              run: |
                  set -euo pipefail
                  test "$(docker image inspect mrs-platform-smoke:local --format '{{.Architecture}}')" = "$TARGET_ARCH"
                  timeout 120s docker run --rm --init \
                    --platform "linux/$TARGET_ARCH" \
                    --network none --shm-size=256m \
                    --env "EXPECTED_ARCH=$TARGET_ARCH" \
                    --entrypoint node mrs-platform-smoke:local \
                    scripts/tests/platform-smoke.mjs

            - name: Test entrypoint API cron and shutdown lifecycle without reward tasks
              run: timeout 90s bash scripts/tests/docker-runtime.sh mrs-platform-smoke:local
