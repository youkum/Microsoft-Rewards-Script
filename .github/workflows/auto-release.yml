name: Release and Docker Push

on:
    push:
        branches: ['V4-china']
        paths:
            - package.json
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    REGISTRY: ghcr.io

jobs:
    validate:
        uses: ./.github/workflows/validate.yml

    deploy:
        needs: validate
        if: github.ref == 'refs/heads/V4-china'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: write
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Read release identity
              id: identity
              env:
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                    printf 'ERROR: Production releases require a stable major.minor.patch version.\n' >&2
                    exit 1
                  }
                  printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
                  printf 'image=%s/%s\n' "$REGISTRY" "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Reject reused Git tag or GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPOSITORY: ${{ github.repository }}
                  VERSION: ${{ steps.identity.outputs.version }}
              run: |
                  set -euo pipefail
                  TAG="v$VERSION"
                  if git show-ref --verify --quiet "refs/tags/$TAG"; then
                    printf 'ERROR: Git tag %s already exists. Bump the package version.\n' "$TAG" >&2
                    exit 1
                  fi
                  if gh api "repos/$REPOSITORY/releases/tags/$TAG" > /dev/null 2> "$RUNNER_TEMP/release-check.err"; then
                    printf 'ERROR: Release %s already exists. Bump the package version.\n' "$TAG" >&2
                    exit 1
                  elif ! grep -q '(HTTP 404)' "$RUNNER_TEMP/release-check.err"; then
                    cat "$RUNNER_TEMP/release-check.err" >&2
                    exit 1
                  fi

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Reject reused image version even if release is missing
              env:
                  IMAGE: ${{ steps.identity.outputs.image }}
                  VERSION: ${{ steps.identity.outputs.version }}
              run: |
                  set -euo pipefail
                  if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2> "$RUNNER_TEMP/image-check.err"; then
                    printf 'ERROR: Image %s:%s already exists. Refusing to associate it with a new release; bump the version.\n' "$IMAGE" "$VERSION" >&2
                    exit 1
                  elif ! grep -Eqi 'manifest unknown|no such manifest|name unknown' "$RUNNER_TEMP/image-check.err"; then
                    cat "$RUNNER_TEMP/image-check.err" >&2
                    exit 1
                  fi

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.cn
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.version=${{ steps.identity.outputs.version }}
                  provenance: mode=max
                  sbom: true
                  cache-from: type=gha,scope=${{ github.ref_name }}
                  cache-to: type=gha,scope=${{ github.ref_name }},mode=max

            - name: Verify published digest and revision on both architectures
              env:
                  IMAGE: ${{ steps.identity.outputs.image }}
                  VERSION: ${{ steps.identity.outputs.version }}
                  EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
                  REVISION: ${{ github.sha }}
                  SOURCE: ${{ github.server_url }}/${{ github.repository }}
              run: |
                  set -euo pipefail
                  [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
                  ACTUAL_DIGEST="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
                  test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"
                  docker buildx imagetools inspect "$IMAGE@$EXPECTED_DIGEST" --raw > "$RUNNER_TEMP/image-manifest.json"
                  for ARCH in amd64 arm64; do
                    jq -e --arg arch "$ARCH" '
                      [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | length == 1
                    ' "$RUNNER_TEMP/image-manifest.json"
                    jq -e --arg arch "$ARCH" '
                      .manifests as $manifests
                      | ($manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest) as $digest
                      | any($manifests[];
                          .annotations["vnd.docker.reference.type"] == "attestation-manifest"
                          and .annotations["vnd.docker.reference.digest"] == $digest)
                    ' "$RUNNER_TEMP/image-manifest.json"
                    docker pull --platform "linux/$ARCH" "$IMAGE@$EXPECTED_DIGEST"
                    docker image inspect "$IMAGE@$EXPECTED_DIGEST" > "$RUNNER_TEMP/image-config.json"
                    jq -e --arg arch "$ARCH" --arg revision "$REVISION" --arg source "$SOURCE" --arg version "$VERSION" '
                      .[0] | .Architecture == $arch and .Os == "linux"
                      and .Config.Labels["org.opencontainers.image.revision"] == $revision
                      and .Config.Labels["org.opencontainers.image.source"] == $source
                      and .Config.Labels["org.opencontainers.image.version"] == $version
                    ' "$RUNNER_TEMP/image-config.json"
                  done

            - name: Promote verified digest to moving tags
              env:
                  IMAGE: ${{ steps.identity.outputs.image }}
                  VERSION: ${{ steps.identity.outputs.version }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  docker buildx imagetools create --tag "$IMAGE:${VERSION%%.*}" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

            - name: Create GitHub Release for the verified revision
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.identity.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  name: v${{ steps.identity.outputs.version }}
                  generate_release_notes: true
                  body: |
                      Image: `${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}`
                      Digest: `${{ steps.build.outputs.digest }}`
                      Source revision: `${{ github.sha }}`
